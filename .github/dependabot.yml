# Automatic update proposals, as pull requests that go through the normal CI and review.
version: 2
updates:
  # Actions: also keeps the pinned commit SHAs up to date once ci.yml uses them.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
  # Base image in the Dockerfile (tag and digest).
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
  # npm: no dependency today, ready for the first one.
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
